<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>蓮之空 bot 測試</title>
<style>
  :root { --bg:#faf7f2; --panel:#ffffff; --ink:#2b2622; --muted:#8a8178; --line:#e6dfd6;
          --me:#e9f1ff; --her:#fff3f6; --accent:#c2557a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1917; --panel:#252220; --ink:#ece6df; --muted:#9a9189; --line:#3a3532;
            --me:#22324a; --her:#3a2530; --accent:#e58aa9; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Noto Sans TC", "PingFang TC", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  select, input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
                          border-radius: 8px; padding: 6px 10px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--me); }
  .her { align-self: flex-start; background: var(--her); }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
  form { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
         background: var(--panel); border-top: 1px solid var(--line); }
  #text { flex: 1; min-width: 0; }
  #setup { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  #setup input { flex: 1; min-width: 120px; }
</style>
</head>
<body>
<header>
  <h1>蓮之空 bot 測試</h1>
  <select id="char">{{OPTIONS}}</select>
  <select id="model" title="模型">{{MODELS}}</select>
  <button class="ghost" id="reset" type="button">新對話</button>
  <a class="ghost" href="group" style="text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px">群組聊天</a>
</header>
<div id="setup">
  <input id="name" placeholder="你的暱稱" maxlength="20">
  <input id="pass" type="password" placeholder="通關密碼">
</div>
<div id="log"><div class="note">選角色、填暱稱和通關密碼後就可以聊天。<br>每個角色、每個分頁是一段獨立的對話；按「新對話」重新開始。</div></div>
<form id="f">
  <input id="text" placeholder="說點什麼…" maxlength="500" autocomplete="off">
  <button id="send">送出</button>
</form>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
let session = newSession();
$("name").value = store.get("hasu.name");
$("pass").value = store.get("hasu.pass");
const savedModel = store.get("hasu.model");
if (savedModel && [...$("model").options].some(o => o.value === savedModel)) $("model").value = savedModel;
if ($("model").options.length < 2) $("model").style.display = "none";
const saved = store.get("hasu.char");
if (saved && [...$("char").options].some(o => o.value === saved)) $("char").value = saved;

function add(cls, who, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (who) { const w = document.createElement("div"); w.className = "who"; w.textContent = who; div.appendChild(w); }
  div.appendChild(document.createTextNode(text));
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}
function note(text) { const d = document.createElement("div"); d.className = "note"; d.textContent = text; $("log").appendChild(d); }
function reset(msg) { session = newSession(); $("log").innerHTML = ""; note(msg); }

$("char").onchange = () => { store.set("hasu.char", $("char").value); reset("換成 " + $("char").selectedOptions[0].text + "，開始新對話。"); };
$("model").onchange = () => { store.set("hasu.model", $("model").value); reset("換成 " + $("model").selectedOptions[0].text + "，開始新對話。"); };
$("reset").onclick = () => reset("開始新對話。");

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  const name = $("name").value.trim() || "訪客";
  const pass = $("pass").value;
  if (!text) return;
  if (!pass) { note("請先填通關密碼。"); return; }
  store.set("hasu.name", name); store.set("hasu.pass", pass);
  add("me", name, text);
  $("text").value = ""; $("send").disabled = true;
  const who = () => $("char").selectedOptions[0].text + ($("model").options.length > 1 ? "（" + $("model").selectedOptions[0].text + "）" : "");
  const wait = add("her", who(), "……");
  try {
    const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json", "X-Pass": pass },
      body: JSON.stringify({ character: $("char").value, model: $("model").value, session, name, text }) });
    const data = await r.json();
    wait.remove();
    if (!r.ok) { note(data.error || "出錯了"); return; }
    for (const m of data.messages) add("her", who(), m);
  } catch (err) {
    wait.remove(); note("連線失敗，請再試一次。");
  } finally {
    $("send").disabled = false; $("text").focus();
  }
};
</script>
</body>
</html>

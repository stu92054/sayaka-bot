<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>蓮之空群組聊天</title>
<style>
  :root { --bg:#8ea9d3; --bar:#2f3a4f; --bar-ink:#fff; --panel:#ffffff; --ink:#1f2328; --muted:#5d6b80;
          --her:#ffffff; --me:#85e249; --me-ink:#1f2328; --note:rgba(0,0,0,.18); --note-ink:#fff; --line:#d7dde7;
          --accent:#06c755; --narr-bg:rgba(255,255,255,.88); --narr-ink:#2b3038; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d2129; --bar:#14171d; --panel:#262a33; --ink:#e8eaee; --muted:#9aa3b2;
            --her:#343944; --me:#3a8f2c; --me-ink:#f2f7ee; --note:rgba(255,255,255,.10); --line:#3a404c;
            --narr-bg:#2a2f39; --narr-ink:#d9dde5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Noto Sans TC", "PingFang TC", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bar); color: var(--bar-ink); }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button, header a { font: inherit; font-size: 13px; color: var(--bar-ink); background: transparent;
                            border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 4px 10px;
                            cursor: pointer; text-decoration: none; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
  .row.me { justify-content: flex-end; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 15px; align-self: flex-start; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .avatar.ghost { visibility: hidden; }
  .col { display: flex; flex-direction: column; min-width: 0; max-width: 75%; }
  .who { font-size: 12px; color: var(--note-ink); margin: 0 0 2px 2px; }
  @media (prefers-color-scheme: dark) { .who { color: var(--muted); } }
  .line { display: flex; align-items: flex-end; gap: 4px; }
  .row.me .line { flex-direction: row-reverse; }
  .bubble { padding: 7px 11px; border-radius: 16px; background: var(--her); white-space: pre-wrap; word-break: break-word; }
  .row.me .bubble { background: var(--me); color: var(--me-ink); }
  .meta { font-size: 10px; color: var(--note-ink); line-height: 1.2; white-space: nowrap; text-align: right; }
  .row:not(.me) .meta { text-align: left; }
  @media (prefers-color-scheme: dark) { .meta { color: var(--muted); } }
  .typing .bubble { color: var(--muted); }
  .dots span { display: inline-block; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .narr { align-self: center; width: min(560px, 100%); background: var(--narr-bg); color: var(--narr-ink);
          border-left: 3px solid var(--accent); border-radius: 10px; padding: 8px 12px; font-size: 13.5px;
          line-height: 1.6; white-space: pre-wrap; }
  .narr .stamp { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .narr.ooc { border-left-color: var(--muted); font-size: 12.5px; }
  .note { align-self: center; background: var(--note); color: var(--note-ink); font-size: 12px; padding: 3px 12px;
          border-radius: 12px; text-align: center; max-width: 90%; }
  form#f { display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--panel);
           border-top: 1px solid var(--line); }
  input, select, button { font: inherit; color: inherit; }
  #text { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 18px; padding: 7px 14px; background: var(--panel); }
  #send { border: none; border-radius: 18px; padding: 7px 16px; background: var(--accent); color: #fff; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  /* 進群前的設定 */
  #setup { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; display: flex; justify-content: center;
           padding: 24px 16px; z-index: 5; }
  #setup .card { background: var(--panel); border-radius: 16px; padding: 20px; width: 100%; max-width: 440px;
                 display: flex; flex-direction: column; gap: 14px; height: fit-content; }
  #setup h2 { margin: 0; font-size: 18px; }
  #setup label.title { font-size: 13px; color: var(--muted); }
  #setup input[type=text], #setup input[type=password], #setup select, #setup textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel);
    font: inherit; color: inherit; }
  #setup textarea { resize: vertical; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
          padding: 4px 12px 4px 4px; cursor: pointer; user-select: none; }
  .pick input { display: none; }
  .pick .avatar { width: 26px; height: 26px; font-size: 13px; align-self: center; }
  .pick.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  #start { border: none; border-radius: 10px; padding: 10px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .err { color: #d33; font-size: 13px; min-height: 1em; margin: 0; }
  #rooms { display: flex; flex-direction: column; gap: 6px; }
  .room { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px;
          padding: 8px 10px; cursor: pointer; text-align: left; background: var(--panel); width: 100%; }
  .room:hover, .room:focus-visible { border-color: var(--accent); outline: none; }
  .room .faces { display: flex; flex: none; }
  .room .faces .avatar { width: 26px; height: 26px; font-size: 12px; margin-right: -6px; border: 2px solid var(--panel); }
  .room .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .room .t1 { font-weight: 700; font-size: 14px; display: flex; gap: 6px; }
  .room .t1 span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .when { font-weight: 400; font-size: 11px; color: var(--muted); flex: none; }
  .room .t2 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .del { flex: none; border: none; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
               padding: 4px 6px; border-radius: 6px; }
  .room .del:hover { color: #d33; }
  .sep { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
</style>
</head>
<body>
<header>
  <h1 id="title">群組</h1>
  <button id="edit" type="button">列表</button>
  <a href="./">一對一</a>
</header>
<div id="log"></div>
<form id="f">
  <input id="text" placeholder="輸入訊息" maxlength="500" autocomplete="off">
  <button id="send">送出</button>
</form>

<div id="setup">
  <div class="card">
    <div>
      <label class="title" for="pass">通關密碼</label>
      <input id="pass" type="password">
    </div>
    <h2>聊天列表</h2>
    <div id="rooms"><p class="hint">填好通關密碼就會列出之前的群組。</p></div>
    <hr class="sep">
    <h2>建立新群組</h2>
    <div>
      <label class="title">成員</label>
      <div class="picks" id="picks"></div>
    </div>
    <div>
      <label class="title" for="identity">你在群組裡的身分</label>
      <select id="identity">
        <option value="fan">粉絲</option>
        <option value="producer">製作人</option>
        <option value="classmate">同學</option>
        <option value="custom">自己填…</option>
      </select>
      <input id="custom" type="text" maxlength="40" placeholder="例如：沙耶香的國中同學" style="margin-top:6px;display:none">
    </div>
    <div>
      <label class="title" for="situation">情境</label>
      <select id="situation">
        <option value="line">LINE 群組（各自用手機傳訊息）</option>
        <option value="clubroom">社辦閒聊（面對面）</option>
        <option value="oden">社辦圍著吃關東煮（面對面）</option>
        <option value="custom">自己填…</option>
      </select>
      <textarea id="situationCustom" maxlength="200" rows="2" placeholder="例如：合宿的晚上，大家在同一間房間，關燈後還在小聲聊天" style="margin-top:6px;display:none"></textarea>
    </div>
    <div>
      <label class="title" for="timeMode">時間</label>
      <select id="timeMode">
        <option value="real">跟現實時間一樣</option>
        <option value="custom">自己設定…</option>
      </select>
      <input id="timeCustom" type="text" maxlength="60" placeholder="例如：聖誕節晚上 10 點、合宿第二天清晨" style="margin-top:6px;display:none">
    </div>
    <div>
      <label class="title" for="play">玩法</label>
      <select id="play">
        <option value="off">日常聊天（沒有旁白）</option>
        <option value="fun">劇本・有趣（GM 旁白，世界會回應）</option>
        <option value="wild">劇本・失控（每回合都出事）</option>
      </select>
      <div id="director" style="display:none;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        <select id="gmStyle" style="flex:1;min-width:140px">
          <option value="short">旁白：簡短（1～3 句）</option>
          <option value="trpg">旁白：小說（TRPG 規則，推進時間線）</option>
        </select>
        <select id="gmModel" style="flex:1;min-width:120px"></select>
      </div>
      <p class="hint" id="directorHint" style="margin-top:6px">用 {} 下導演指令，只有 GM 看得到，例如「{書店店員是沙知學姊}」「{時間快轉到中午}」「{分析一下大家對我的態度}」。</p>
    </div>
    <div>
      <label class="title" for="name">暱稱</label>
      <input id="name" type="text" maxlength="20" placeholder="她們會這樣叫你">
    </div>
    <p class="hint">點名（例如「綴理覺得呢？」）就是她回；沒點名時由最自然會接話的人回。每次最多回 3 則。</p>
    <p class="err" id="err"></p>
    <button id="start" type="button">開始聊天</button>
  </div>
</div>

<script>
const MEMBERS = {{MEMBERS}};
const GMS = {{GMS}};
const GM_LABEL = { gemini: "GM：Gemini", deepseek: "GM：DeepSeek" };
const UNITS = [{ name: "DOLLCHESTRA", keys: ["kosuzu", "sayaka", "tsuzuri"] }];
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const byKey = Object.fromEntries(MEMBERS.map(m => [m.key, m]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hhmm = (ts) => {
  const d = ts ? new Date(ts * 1000) : new Date();
  const t = d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  return d.toDateString() === new Date().toDateString() ? t : `${d.getMonth() + 1}/${d.getDate()} ${t}`;
};
const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
let room = null;  // { members, identity, situation, time, name, pass, session, play, gm, gm_style }

function avatar(m, ghost) {
  const a = document.createElement("div");
  a.className = "avatar" + (ghost ? " ghost" : "");
  a.style.background = m.color;
  a.textContent = m.name.slice(-1);
  return a;
}

// 設定畫面
const saved = (store.get("hasu.group.members") || "").split(",").filter(k => byKey[k]);
for (const m of MEMBERS) {
  const lab = document.createElement("label");
  lab.className = "pick";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.value = m.key; cb.checked = saved.length ? saved.includes(m.key) : true;
  lab.classList.toggle("on", cb.checked);
  cb.onchange = () => lab.classList.toggle("on", cb.checked);
  lab.append(cb, avatar(m), document.createTextNode(m.name));
  $("picks").appendChild(lab);
}
$("identity").value = store.get("hasu.group.identity") || "fan";
$("custom").value = store.get("hasu.group.custom");
$("name").value = store.get("hasu.name");
$("pass").value = store.get("hasu.pass");
const syncCustom = () => { $("custom").style.display = $("identity").value === "custom" ? "" : "none"; };
$("identity").onchange = syncCustom; syncCustom();
$("situation").value = store.get("hasu.group.situation") || "line";
$("situationCustom").value = store.get("hasu.group.situationCustom");
const syncSituation = () => { $("situationCustom").style.display = $("situation").value === "custom" ? "" : "none"; };
$("situation").onchange = syncSituation; syncSituation();
$("timeMode").value = store.get("hasu.group.timeMode") || "real";
$("timeCustom").value = store.get("hasu.group.timeCustom");
const syncTime = () => { $("timeCustom").style.display = $("timeMode").value === "custom" ? "" : "none"; };
$("timeMode").onchange = syncTime; syncTime();
for (const g of GMS) { const o = document.createElement("option"); o.value = g; o.textContent = GM_LABEL[g] || g; $("gmModel").append(o); }
$("play").value = store.get("hasu.group.play") || "off";
$("gmStyle").value = store.get("hasu.group.gmStyle") || "short";
$("gmModel").value = GMS.includes(store.get("hasu.group.gm")) ? store.get("hasu.group.gm") : (GMS.includes("gemini") ? "gemini" : GMS[0]);
const syncPlay = () => {
  const on = $("play").value !== "off";
  $("director").style.display = on ? "flex" : "none"; $("directorHint").style.display = on ? "" : "none";
};
$("play").onchange = syncPlay; syncPlay();

$("start").onclick = () => {
  const members = [...$("picks").querySelectorAll("input:checked")].map(c => c.value);
  const custom = $("custom").value.trim();
  const identity = $("identity").value === "custom" ? custom : $("identity").value;
  const name = $("name").value.trim() || "訪客";
  const pass = $("pass").value;
  if (!members.length) { $("err").textContent = "至少選一個人。"; return; }
  if ($("identity").value === "custom" && !custom) { $("err").textContent = "請填你的身分。"; return; }
  const situationCustom = $("situationCustom").value.trim();
  const situation = $("situation").value === "custom" ? situationCustom : $("situation").value;
  if ($("situation").value === "custom" && !situationCustom) { $("err").textContent = "請填情境。"; return; }
  const timeCustom = $("timeCustom").value.trim();
  const time = $("timeMode").value === "custom" ? timeCustom : "";
  if ($("timeMode").value === "custom" && !timeCustom) { $("err").textContent = "請填時間。"; return; }
  if (!pass) { $("err").textContent = "請填通關密碼。"; return; }
  store.set("hasu.group.members", members.join(",")); store.set("hasu.group.identity", $("identity").value);
  store.set("hasu.group.custom", custom); store.set("hasu.name", name); store.set("hasu.pass", pass);
  store.set("hasu.group.situation", $("situation").value); store.set("hasu.group.situationCustom", situationCustom);
  store.set("hasu.group.timeMode", $("timeMode").value); store.set("hasu.group.timeCustom", timeCustom);
  store.set("hasu.group.play", $("play").value); store.set("hasu.group.gmStyle", $("gmStyle").value);
  store.set("hasu.group.gm", $("gmModel").value);
  enter({ members, identity, situation, time, name, pass, session: newSession(),
          play: $("play").value, gm: $("gmModel").value, gm_style: $("gmStyle").value }, []);
};
$("edit").onclick = () => { $("setup").style.display = ""; loadRooms(); };
$("pass").onchange = () => { store.set("hasu.pass", $("pass").value); loadRooms(); };

function titleOf(members) {
  const unit = UNITS.find(u => u.keys.length === members.length && u.keys.every(k => members.includes(k)));
  return unit ? unit.name : members.map(k => byKey[k] ? byKey[k].name : k).join("、");
}
function situationLabel(v) {
  const o = [...$("situation").options].find(o => o.value === v && v !== "custom");
  return o ? o.text : v || $("situation").options[0].text;
}

// 進入群組：新的（lines 空）或從列表接著聊（畫出之前的對話）
function enter(r, lines) {
  room = r;
  store.set("hasu.group.room", r.session);
  $("title").textContent = `${titleOf(r.members)}（${r.members.length + 1}）`;
  $("log").innerHTML = ""; lastSpeaker = null;
  note(`情境：${situationLabel(r.situation)}`);
  if (r.time) note(`時間：${r.time}`);
  if (r.play && r.play !== "off") note(`玩法：${$("play").querySelector(`option[value="${r.play}"]`)?.textContent || r.play}`);
  if (!lines.length) note(`${r.name} 加入了群組`);
  for (const l of lines) {
    if (l.speaker === "narrator") { const m = l.text.match(/^\[([^\]]*)\] ([\s\S]*)$/); narr(m ? m[2] : l.text, m ? m[1] : ""); continue; }
    if (l.speaker === "gm") { narr(l.text, "GM（戲外）", true); continue; }
    if (l.speaker === "user") { bubble(null, l.text, { at: l.created }).querySelector(".read").textContent = "已讀"; continue; }
    const m = byKey[l.speaker];
    if (!m) continue;
    for (const t of l.text.split("\n").filter(Boolean)) bubble(m, t, { at: l.created });
  }
  if (lines.length) note("以上是之前的對話");
  $("err").textContent = "";
  $("setup").style.display = "none";
  $("text").focus();
}

async function call(method, path) {
  const r = await fetch(path, { method, headers: { "X-Pass": $("pass").value } });
  const data = await r.json().catch(() => ({ error: "出錯了" }));
  if (!r.ok) throw new Error(data.error || "出錯了");
  return data;
}

async function openRoom(id) {
  try {
    const r = await call("GET", `api/group/rooms/${encodeURIComponent(id)}`);
    if (r.members.some(k => !byKey[k])) throw new Error("這個群組有已經不在網站上的成員。");
    const x = r.extra || {};
    enter({ members: r.members, identity: r.identity, situation: r.situation, time: r.time,
            name: r.name || $("name").value.trim() || "訪客", pass: $("pass").value, session: r.id,
            play: x.play || "off", gm: GMS.includes(x.gm) ? x.gm : GMS[0], gm_style: x.gm_style || "short" }, r.lines);
  } catch (err) {
    $("setup").style.display = ""; $("err").textContent = err.message;
  }
}

async function loadRooms() {
  const box = $("rooms");
  if (!$("pass").value) { box.innerHTML = '<p class="hint">填好通關密碼就會列出之前的群組。</p>'; return; }
  let list;
  try { list = (await call("GET", "api/group/rooms")).rooms; }
  catch (err) { box.innerHTML = ""; const p = document.createElement("p"); p.className = "err"; p.textContent = err.message; box.append(p); return; }
  box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<p class="hint">還沒有聊過的群組。</p>'; return; }
  for (const r of list) {
    const item = document.createElement("div");
    item.className = "room"; item.tabIndex = 0; item.setAttribute("role", "button");
    const faces = document.createElement("div"); faces.className = "faces";
    r.members.filter(k => byKey[k]).forEach(k => faces.append(avatar(byKey[k])));
    const txt = document.createElement("div"); txt.className = "txt";
    const t1 = document.createElement("div"); t1.className = "t1";
    const name = document.createElement("span"); name.textContent = `${titleOf(r.members)}・${situationLabel(r.situation)}`;
    const when = document.createElement("span"); when.className = "when"; when.textContent = hhmm(r.updated);
    t1.append(name, when);
    const t2 = document.createElement("div"); t2.className = "t2";
    t2.textContent = `${r.name}${r.time ? "｜" + r.time : ""}｜${r.last || "（還沒說話）"}`;
    txt.append(t1, t2);
    const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "✕";
    del.title = "刪除這個群組";
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm("刪除這個群組的對話？刪了就找不回來。")) return;
      try { await call("DELETE", `api/group/rooms/${encodeURIComponent(r.id)}`); } catch (err) { alert(err.message); }
      if (store.get("hasu.group.room") === r.id) store.set("hasu.group.room", "");
      loadRooms();
    };
    item.append(faces, txt, del);
    item.onclick = () => openRoom(r.id);
    item.onkeydown = e => { if (e.key === "Enter") openRoom(r.id); };
    box.append(item);
  }
}

// 打開頁面：上次在聊的群組直接接著聊，沒有就顯示列表
if ($("pass").value && store.get("hasu.group.room")) openRoom(store.get("hasu.group.room")).then(loadRooms);
else loadRooms();

// 聊天
function scroll() { $("log").scrollTop = $("log").scrollHeight; }
function narr(text, stamp, ooc) {
  const d = document.createElement("div"); d.className = "narr" + (ooc ? " ooc" : "");
  if (stamp) { const s = document.createElement("span"); s.className = "stamp"; s.textContent = stamp; d.append(s); }
  d.append(document.createTextNode(text)); $("log").appendChild(d); lastSpeaker = null; scroll();
}
function note(text) {
  const d = document.createElement("div"); d.className = "note"; d.textContent = text; $("log").appendChild(d); scroll();
}
let lastSpeaker = null;
function bubble(m, text, opts = {}) {
  const row = document.createElement("div");
  row.className = "row" + (m ? "" : " me") + (opts.typing ? " typing" : "");
  const col = document.createElement("div"); col.className = "col";
  const first = m && lastSpeaker !== m.key;
  if (m) {
    row.appendChild(avatar(m, !first));
    if (first) { const w = document.createElement("div"); w.className = "who"; w.textContent = m.name; col.appendChild(w); }
  }
  const line = document.createElement("div"); line.className = "line";
  const b = document.createElement("div"); b.className = "bubble";
  if (opts.typing) b.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span>';
  else b.textContent = text;
  const meta = document.createElement("div"); meta.className = "meta";
  meta.innerHTML = opts.typing ? "" : `<div class="read"></div><div>${hhmm(opts.at)}</div>`;
  line.append(b, meta); col.appendChild(line); row.appendChild(col);
  $("log").appendChild(row); scroll();
  if (!opts.typing) lastSpeaker = m ? m.key : null;
  return row;
}

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Pass": room.pass },
    body: JSON.stringify({ ...body, session: room.session, members: room.members }) });
  const data = await r.json().catch(() => ({ error: "出錯了" }));
  if (!r.ok) throw new Error(data.error || "出錯了");
  return data;
}

$("f").onsubmit = async e => {
  e.preventDefault();
  if (!room) { $("setup").style.display = ""; return; }
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = ""; $("send").disabled = true;
  const mine = bubble(null, text);
  try {
    const sent = api("api/group/send", { name: room.name, identity: room.identity, situation: room.situation,
      time: room.time, play: room.play, gm: room.gm, gm_style: room.gm_style, text });
    await sleep(500 + Math.random() * 700);
    const res = await sent;
    let next = res.next;
    mine.querySelector(".read").textContent = `已讀 ${room.members.length}`;
    if (res.ooc) narr(res.ooc, "GM（戲外）", true);
    if (res.narration) { await sleep(400); narr(res.narration, res.time || ""); }
    if (!next && !res.narration && !res.ooc) note("（這次沒有人回應，可以換個說法再試）");
    while (next) {
      const m = byKey[next];
      await sleep(700 + Math.random() * 1500);
      let typing = bubble(m, "", { typing: true });
      const said = await api("api/group/speak", { speaker: next });
      typing.remove();
      if (!said.ok) { note(`${m.name}：${said.messages.join(" ")}`); break; }
      for (let i = 0; i < said.messages.length; i++) {
        if (i > 0) {
          typing = bubble(m, "", { typing: true });
          await sleep(Math.min(400 + said.messages[i].length * 45, 2400));
          typing.remove();
        }
        bubble(m, said.messages[i]);
      }
      next = said.next;
    }
  } catch (err) {
    document.querySelectorAll(".typing").forEach(t => t.remove());
    note(err.message || "連線失敗，請再試一次。");
  } finally {
    $("send").disabled = false; $("text").focus();
  }
};
</script>
